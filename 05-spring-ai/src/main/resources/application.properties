spring.application.name=budgeting
spring.docker.compose.enabled=false
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/budgeting}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:budgeting_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.transcription.transcription-path=/audio/transcriptions
spring.ai.openai.audio.transcription.options.model=whisper-large-v3-turbo
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.temperature=0
spring.ai.openai.audio.transcription.options.response-format=text
spring.ai.openai.audio.transcription.options.prompt=Áudio em português brasileiro.\
  Áudio contém descrição de gastos financeiros. \
  As frases geralmente contêm: \
   - um valor em reais (número + "reais"); \
   - uma ação (gastei, paguei, comprei); \
   - um local ou estabelecimento (mercado, farmácia, restaurante, loja, etc.).
spring.ai.model.audio.speech=openai
spring.ai.openai.audio.speech.speech-path=/audio/speech
spring.ai.openai.audio.speech.options.model=canopylabs/orpheus-v1-english
spring.ai.openai.audio.speech.options.voice=hannah
spring.ai.openai.audio.speech.options.response-format=wav
logging.level.org.springframework.ai=DEBUG
